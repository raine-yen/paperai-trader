appId: com.papertrader.mobile
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 30000
- tapOn: "Create"
- tapOn: "Display name"
- inputText: "PaperAI Preview"
- tapOn: "Email"
- inputText: "${PREVIEW_EMAIL}"
- tapOn: "Password"
- inputText: "PaperAI-Preview-2026!"
- tapOn: "Create account"
- extendedWaitUntil:
    visible: "Account home"
    timeout: 60000

- tapOn: "Search"
- extendedWaitUntil:
    visible: "Find stocks"
    timeout: 30000
- extendedWaitUntil:
    visible: "AAPL"
    timeout: 30000
- takeScreenshot: "02-search-and-trade"

- scrollUntilVisible:
    element:
      text: "Buy AAPL"
    direction: DOWN
    timeout: 30000
    speed: 60
- tapOn: "Buy AAPL"
- extendedWaitUntil:
    visible: "Order submitted"
    timeout: 30000
- tapOn: "OK"
- swipe:
    start: "50%,30%"
    end: "50%,82%"
    duration: 700
- tapOn: "Portfolio"
- extendedWaitUntil:
    visible: "Holdings"
    timeout: 30000
- takeScreenshot: "01-portfolio"

- tapOn: "Compete"
- extendedWaitUntil:
    visible: "Global leaderboard"
    timeout: 30000
- takeScreenshot: "03-global-leaderboard"
